NATS:
  - port: 4222
    host: nats.oca.lan
    protocol: nats
  - port: 4222
    host: localhost
    protocol: nats

STREAMS:
  tic_telemetry: # Retention policy for TIC telemetry: minimum 1 day, as long as disk space limit is not reached
    Subjects:
      - tic.telemetry.>
    Description: "TIC telemetry - for any useful diagnostic data, and for (mostly numerical) values which may be presented in UI"
    MaxAge: 2592000   # 2592000s = 30 days
    MaxBytes: 524288000  # max size in bytes 524288000 = 500 MB
    NoAck: false
    Discard: old
    DenyDelete: false
    DenyPurge: false
  tic_config: # Retention policy for TIC config: no time limit, new config exchanges old one, no need for a lot of disk space
    Subjects:
      - tic.config.>  # including tic.config.observatory subject for main OCA observatory config
    Description: "For observatory config (and maqybe similar configs). Last message in subject is the current config."
    MaxAge: null   # No time limit
    MaxBytes: 10485760  # max size in bytes 10 MB
    MaxMsgsPerSubject: 10 # save some history
    NoAck: false
    Discard: old
    DenyDelete: false
    DenyPurge: false
  tic_status: # Retention policy for TIC components status logs: minimum 1 day, as long as disk space limit is not reached
    Subjects:
      - tic.status.>
    # e.g.
    #       tic.status.zb08.program.current   # current program published on program loading
    #       tic.status.zb08.program.state     # state of the program tasks execution
    Description: "For components and operations statuses. Mostly enum strings, may be used in application logic, and UI"
    MaxAge: 2592000   # 2592000s = 30 days
    MaxBytes: 524288000  # max size in bytes 500 MB
    NoAck: false
    Discard: old
    DenyDelete: false
    DenyPurge: false
  tic_planner: # For obs plan updates.
    Subjects:
      - tic.planner.>
    Description: "For planner - obs plan updates."
    MaxAge: 2592000   # 2592000s = 30 days
    MaxBytes: 524288000  # max size in bytes 500 MB
    NoAck: false
    Discard: old
    DenyDelete: false
    DenyPurge: false
  tic_journal: # Retention policy for TICjournal: minimum 1 day, as long as disk space limit is not reached
    Subjects:
      - tic.journal.>
    Description: "For components and operations textual logs which should be presented to the operator."
    MaxAge: 2592000   # 2592000s = 30 days
    MaxBytes: 524288000  # max size in bytes 500 MB
    NoAck: false
    Discard: old
    DenyDelete: false
    DenyPurge: false
  tic_progress: # Retention policy for TIC operations progess tracking: max 1 day, in memory
    Description: "For progress tracking of long operations. Last message in subject is the current progress. use by specialized MsgProgessXXX classes."
    Subjects:
      - tic.progress.>
    MaxAge: 86400   # 2592000s = 30 days
    MaxBytes: 524288000  # max size in bytes 500 MB
    MaxMsgsPerSubject: 10 # save some history
#    Storage: memory   # will not survive restart
    NoAck: false
    Discard: old
    DenyDelete: false
    DenyPurge: false
  # Do not uncomment, just for reference and reservation of the Subject name
  #    tic_rpc:  # Retention policy for RPC Req-Resp: DO NOT USE JetStream for RPC, use NATS core with tic.rpc subject
  #        Subjects:
  #            - tic.rpc.>
  #        Description: "Request-Reposnse calls to remote components. JetStream not needed, and not suitable for RPC."
  # service realted subjects and streams
  svc_registry:
    Subjects:
      - svc.registry.>
    Description: "Service lifecycle events (start/stop/declared/ready/stopping)"
    MaxAge: null              # Keep indefinitely for discovery
    MaxBytes: 10485760        # 10 MB
    MaxMsgsPerSubject: 100    # Keep history per service
    NoAck: false
    Discard: old
    DenyDelete: false
    DenyPurge: false
  svc_status:
    Subjects:
      - svc.status.>
    Description: "Service status updates and health information"
    MaxAge: 2592000           # 30 days
    MaxBytes: 524288000       # 500 MB
    NoAck: false
    Discard: old
    DenyDelete: false
    DenyPurge: false
  svc_heartbeat:
    Subjects:
      - svc.heartbeat.>
    Description: "Service heartbeat messages"
    MaxAge: 86400             # 1 day
    MaxBytes: 104857600       # 100 MB
#    Storage: memory           # Fast, no persistence needed, inmemory streams are not preserved after restart :(
    NoAck: false
    Discard: old
    DenyDelete: false
    DenyPurge: false
  # svc.> is reserved for the ocabox-tcs library (heartbeat, status, registry); application RPC is rpc.> (below).
  svc_publish:
    Subjects:
      - svc.publish.>
    Description: "Synthesized product snapshots from services (e.g. pms.aggregator publishes svc.publish.oca.observatory.{environment,telescopes,observing.<tele>,services}). Each product republishes a fixed-shape snapshot every cycle; consumers read the latest message per subject for current state."
    # Retention strategy: disk-bound, not time-bound. MaxAge is a generous
    # nominal upper bound (so nothing truly ancient lingers); MaxBytes is the
    # actual cap; MaxMsgsPerSubject keeps any one heavyweight product (e.g.
    # observing.<tele> with full plan dumps) from crowding out slow ones
    # (environment, services) when Discard: old kicks in globally-oldest-first.
    MaxAge: 1209600            # 14 days — nominal upper bound; rarely the binding constraint
    MaxBytes: 524288000        # 500 MB — primary cap; covers ~half-day of full traffic at peak
    MaxMsgsPerSubject: 1000    # per-subject fairness; ~4h for 15s cadence, ~8h for 30s cadence
    NoAck: false
    Discard: old
    DenyDelete: false
    DenyPurge: false
  # --- Classes of the subject grammar <class>.<realm>.<scope>.<element>.<item> (oca_nats_config#2) ---
  # New services publish here; the legacy tic.* / svc.publish.* families stay until migrated writer by writer.
  status:
    Subjects:
      - status.>
    Description: "State of components and services (enum, bool, scalar), one value per subject, on change plus keepalive; e.g. status.optics.jk15.camera.sees. Consumers read the last message per subject."
    MaxAge: 2592000            # 30 days
    MaxBytes: 524288000        # 500 MB
    MaxMsgsPerSubject: 1000    # per-subject fairness: a chatty subject can't evict the slow ones
    NoAck: false
    Discard: old
    DenyDelete: false
    DenyPurge: false
  telemetry:
    Subjects:
      - telemetry.>
    # One stream for the whole class. It also keeps capturing the legacy 3-token families
    # (telemetry.weather.davis, .conditions.*, .power.*, .water.level, ...) until they move to
    # telemetry.env|fac.<scope>.<element>.<metric>; a second stream on telemetry.> would overlap them.
    Description: "Numeric measurements, one value per subject (a subject is one time series); e.g. telemetry.tic.zb08.mount.altitude, telemetry.env.oca.davis.temperature_c."
    MaxAge: 2592000            # 30 days
    MaxBytes: 1073741824       # 1 GB: legacy telemetry (500 MB today) plus migrated tic.telemetry
    NoAck: false
    Discard: old
    DenyDelete: false
    DenyPurge: false
  event:
    Subjects:
      - event.>
    Description: "Something happened (past tense): lifecycle, exposure done, frame downloaded; e.g. event.ofp.zb08.camera.downloaded, event.planner.zb08.main.error."
    MaxAge: 2592000            # 30 days
    MaxBytes: 524288000        # 500 MB
    NoAck: false
    Discard: old
    DenyDelete: false
    DenyPurge: false
  journal:
    Subjects:
      - journal.>
    Description: "Timestamped log records for humans, realm = the service that narrates; e.g. journal.toi.zb08.self.log, journal.ofp_download.zb08.camera.log."
    MaxAge: 2592000            # 30 days
    MaxBytes: 524288000        # 500 MB (tic.journal + toi.log today: ~250 MB per 30 days)
    NoAck: false
    Discard: old
    DenyDelete: false
    DenyPurge: false
  data:
    Subjects:
      - data.>
    Description: "Pipeline and analysis products: FITS stats, photometry, plans, aggregates; e.g. data.ofp.zb08.camera.raw, data.pms.oca.self.environment."
    # Mixed cadence: per-frame products next to snapshots republished every ~15 s (pms). Disk-bound;
    # MaxMsgsPerSubject keeps a fast snapshot from evicting the nights of frame products.
    MaxAge: 2592000            # 30 days
    MaxBytes: 1073741824       # 1 GB
    MaxMsgsPerSubject: 2000    # >= 2 busy nights of frames per instrument; ~8 h of a 15 s snapshot
    NoAck: false
    Discard: old
    DenyDelete: false
    DenyPurge: false
  message:
    Subjects:
      - message.>
    Description: "Operator notices, realm = the writer; readers subscribe to message.>; e.g. message.toi.oca.self.notice."
    MaxAge: 2592000            # 30 days
    MaxBytes: 104857600        # 100 MB
    NoAck: false
    Discard: old
    DenyDelete: false
    DenyPurge: false
  cfg:
    Subjects:
      - cfg.>
    Description: "Configuration documents; the last message per subject is the current one; e.g. cfg.tic.oca.self.observatory."
    MaxAge: null               # No time limit
    MaxBytes: 10485760         # 10 MB
    MaxMsgsPerSubject: 10      # some history
    NoAck: false
    Discard: old
    DenyDelete: false
    DenyPurge: false
  # Do not add a stream for rpc.>: request/reply is core NATS, and serverish refuses
  # RPC on subjects captured by a stream. Pattern: rpc.<service_type>.<scope>.<element>.<method>, e.g.
  # rpc.optics.jk15.camera.setpath.
  # Do not add a stream for cmd.> either: commands are fire-and-forget on core NATS. A stream would let
  # a restarting listener replay and re-execute old commands; the outcome comes back as event/status.
  test:
    Subjects:
      - test.>
    MaxAge: 3600   # czas w sekundach !! trzymania wiadomości (1 hour for tests)
    MaxBytes: 104857600  # max size in bytes 104857600 = 100 MB
    NoAck: false
    Discard: old  # jakie wiadomości odrzuca gdy się przepełni
    DenyDelete: false  # pozwól na usunięcie danych
    DenyPurge: false  # pozwól na wyczyszczenie strumienia
  oca_event:
    Subjects:
      - oca.event.>
    # e.g.
    #       oca.event.sroca.manual   - srocactl upload -> sroca, manual batch uploads
    #       oca.event.sroca.retry    - srocactl -> sroca, retry/list-failed/ping commands
    #       oca.event.sroca.failed   - sroca -> *, failure notifications
    #       oca.event.sroca.logs     - sroca -> *, WARNING+ per-file events
    Description: "For components and operations events (e.g. sroca FITS -> OcaDB/S3 sync commands and notifications)"
    MaxAge: 2592000   # 30 days — must match sroca's durable consumer inactive_threshold
    MaxBytes: 524288000  # max size in bytes 524288000 = 500 MB
    NoAck: false
    Discard: old
    DenyDelete: false
    DenyPurge: false

KV_BUCKETS:
  SROCA_FAILED_TASK:
    Description: "sroca tasks that failed before dispatch (e.g. FITS load errors) — retried via SrocaTaskHandler"
    History: 1
    TTL: 2592000   # 30 days
  SROCA_FAILED_OCADB:
    Description: "sroca failed OcaDB tasks — one entry per filename, retried via CLI"
    History: 1
    TTL: 2592000   # 30 days
  SROCA_FAILED_S3:
    Description: "sroca failed S3 upload tasks — one entry per filename, retried via CLI"
    History: 1
    TTL: 2592000   # 30 days
  SROCA_FILE_EVENTS:
    Description: "sroca per-file event log — full processing history queryable by filename"
    History: 64
    TTL: 2592000   # 30 days
